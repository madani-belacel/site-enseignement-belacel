<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#f8fafc" rx="8"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#e2e8f0" stroke-width="2" rx="4" stroke-dasharray="8,4"/>
  <text x="400" y="40" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#1e293b">Résolution DNS — Hiérarchie</text>
  <text x="400" y="62" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8">Schéma pédagogique — Module Réseaux — Dr. BELACEL Madani</text>
  <rect x="280" y="95" width="240" height="45" rx="8" fill="#3b82f6"/><text x="400" y="123" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#fff" font-weight="bold">Racine (.)</text>
  <line x1="400" y1="140" x2="400" y2="160" stroke="#94a3b8" stroke-width="2"/>
  <rect x="280" y="160" width="240" height="45" rx="8" fill="#2563eb"/><text x="400" y="188" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#fff" font-weight="bold">TLD (.fr, .com, .org)</text>
  <line x1="400" y1="205" x2="400" y2="225" stroke="#94a3b8" stroke-width="2"/>
  <rect x="280" y="225" width="240" height="45" rx="8" fill="#1d4ed8"/><text x="400" y="253" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#fff" font-weight="bold">Domaine (example.com)</text>
  <line x1="400" y1="270" x2="400" y2="290" stroke="#94a3b8" stroke-width="2"/>
  <rect x="280" y="290" width="240" height="45" rx="8" fill="#7c3aed"/><text x="400" y="318" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#fff" font-weight="bold">Sous-domaine (www)</text>
  <rect x="50" y="370" width="700" height="90" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="60" y="392" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#475569">Étapes de résolution:</text>
  <text x="60" y="410" font-family="Arial,sans-serif" font-size="10" fill="#64748b">1. Client → DNS local (stub resolver)</text>
  <text x="60" y="426" font-family="Arial,sans-serif" font-size="10" fill="#64748b">2. DNS local → DNS Racine → DNS TLD → DNS faisant autorité</text>
  <text x="60" y="442" font-family="Arial,sans-serif" font-size="10" fill="#64748b">3. Cache DNS local mis à jour, résultat retourné au client</text>
</svg>