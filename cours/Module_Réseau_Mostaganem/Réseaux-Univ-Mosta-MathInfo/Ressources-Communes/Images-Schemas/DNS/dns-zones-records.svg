<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#f8fafc" rx="8"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#e2e8f0" stroke-width="2" rx="4" stroke-dasharray="8,4"/>
  <text x="400" y="40" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#1e293b">DNS — Zones et Enregistrements</text>
  <text x="400" y="62" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8">Schéma pédagogique — Module Réseaux — Dr. BELACEL Madani</text>
  <rect x="100" y="100" width="200" height="55" rx="8" fill="#3b82f6"/>
  <text x="200" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#fff" font-weight="bold">Zone Racine (.)</text>
  <text x="200" y="145" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#bfdbfe">13 serveurs racines</text>
  <line x1="200" y1="155" x2="200" y2="185" stroke="#94a3b8" stroke-width="2"/>
  <rect x="100" y="185" width="200" height="55" rx="8" fill="#2563eb"/>
  <text x="200" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#fff" font-weight="bold">TLD (.dz, .com, .org)</text>
  <text x="200" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#bfdbfe">Domaines de premier niveau</text>
  <line x1="140" y1="240" x2="140" y2="270" stroke="#94a3b8" stroke-width="2"/><line x1="260" y1="240" x2="260" y2="270" stroke="#94a3b8" stroke-width="2"/>
  <rect x="40" y="270" width="200" height="55" rx="8" fill="#1d4ed8"/>
  <text x="140" y="295" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#fff">Domaine Autorité</text>
  <text x="140" y="315" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#bfdbfe">univ-mosta.dz</text>
  <rect x="160" y="270" width="200" height="55" rx="8" fill="#1d4ed8"/>
  <text x="260" y="295" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#fff">Sous-domaines</text>
  <text x="260" y="315" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#bfdbfe">mail, www, moodle</text>
  <rect x="530" y="380" width="220" height="85" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="640" y="400" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#475569">Enregistrements DNS</text>
  <text x="540" y="420" font-family="Arial,sans-serif" font-size="10" fill="#64748b">A    → 192.168.1.1 (IPv4)</text>
  <text x="540" y="438" font-family="Arial,sans-serif" font-size="10" fill="#64748b">AAAA → ::1 (IPv6)</text>
  <text x="540" y="456" font-family="Arial,sans-serif" font-size="10" fill="#64748b">MX   → mail (priorité 10)</text>
</svg>