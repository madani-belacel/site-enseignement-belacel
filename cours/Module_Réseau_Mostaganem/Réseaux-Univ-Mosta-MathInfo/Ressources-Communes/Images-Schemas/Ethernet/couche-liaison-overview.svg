<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#f8fafc" rx="8"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#e2e8f0" stroke-width="2" rx="4" stroke-dasharray="8,4"/>
  <text x="400" y="40" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#1e293b">Couche Liaison — Vue d'Ensemble</text>
  <text x="400" y="62" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8">Schéma pédagogique — Module Réseaux — Dr. BELACEL Madani</text>
  <rect x="80" y="100" width="180" height="40" rx="6" fill="#3b82f6"/><text x="170" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#fff">Couche Application</text>
  <rect x="80" y="145" width="180" height="40" rx="6" fill="#2563eb"/><text x="170" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#fff">Couche Transport</text>
  <rect x="80" y="190" width="180" height="40" rx="6" fill="#1d4ed8"/><text x="170" y="215" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#fff">Couche Réseau</text>
  <rect x="80" y="235" width="180" height="60" rx="6" fill="#ef4444" stroke="#fff" stroke-width="3"/>
  <text x="170" y="258" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#fff" font-weight="bold">Couche Liaison (L2)</text>
  <text x="170" y="278" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fca5a5">Ethernet, MAC, Switch</text>
  <rect x="80" y="300" width="180" height="40" rx="6" fill="#991b1b"/><text x="170" y="325" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#fff">Couche Physique</text>
  <rect x="340" y="100" width="400" height="250" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="540" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Rôle de la Couche Liaison</text>
  <text x="355" y="150" font-family="Arial,sans-serif" font-size="12" fill="#475569">1. Adressage MAC (48 bits)</text>
  <text x="355" y="170" font-family="Arial,sans-serif" font-size="12" fill="#475569">2. Encapsulation en trames</text>
  <text x="355" y="190" font-family="Arial,sans-serif" font-size="12" fill="#475569">3. Contrôle d'erreur (FCS/CRC)</text>
  <text x="355" y="210" font-family="Arial,sans-serif" font-size="12" fill="#475569">4. Accès au support (CSMA/CD)</text>
  <text x="355" y="230" font-family="Arial,sans-serif" font-size="12" fill="#475569">5. Détection de collisions</text>
  <text x="355" y="250" font-family="Arial,sans-serif" font-size="12" fill="#475569">6. VLAN (802.1Q) — segmentation</text>
  <text x="355" y="270" font-family="Arial,sans-serif" font-size="12" fill="#475569">7. STP — boucle et redondance</text>
  <text x="355" y="300" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#ef4444">Normes: IEEE 802.3 (Ethernet)</text>
  <text x="355" y="320" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#ef4444">           802.11 (Wi-Fi)</text>
  <text x="355" y="340" font-family="Arial,sans-serif" font-size="11" fill="#64748b">PDU: Trame (Frame)</text>
</svg>