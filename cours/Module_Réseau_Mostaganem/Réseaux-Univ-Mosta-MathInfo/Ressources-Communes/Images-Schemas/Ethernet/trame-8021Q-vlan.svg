<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#f8fafc" rx="8"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#e2e8f0" stroke-width="2" rx="4" stroke-dasharray="8,4"/>
  <text x="400" y="40" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#1e293b">Trame Ethernet 802.1Q — VLAN</text>
  <text x="400" y="62" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8">Schéma pédagogique — Module Réseaux — Dr. BELACEL Madani</text>
  <rect x="50" y="100" width="700" height="40" rx="6" fill="#f0f4f8" stroke="#cbd5e1" stroke-width="1"/>
  <text x="400" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#475569">Trame 802.1Q — Insertion du tag VLAN</text>
  <rect x="50" y="145" width="80" height="25" rx="3" fill="#3b82f6"/><text x="90" y="162" text-anchor="middle" font-family="monospace" font-size="9" fill="#fff">Préambule</text>
  <rect x="135" y="145" width="60" height="25" rx="3" fill="#1d4ed8"/><text x="165" y="162" text-anchor="middle" font-family="monospace" font-size="9" fill="#fff">MAC dst</text>
  <rect x="200" y="145" width="60" height="25" rx="3" fill="#1d4ed8"/><text x="230" y="162" text-anchor="middle" font-family="monospace" font-size="9" fill="#fff">MAC src</text>
  <rect x="265" y="145" width="50" height="25" rx="3" fill="#dc2626" stroke="#fff" stroke-width="2"/><text x="290" y="162" text-anchor="middle" font-family="monospace" font-size="8" fill="#fff">TPID</text>
  <rect x="320" y="145" width="50" height="25" rx="3" fill="#dc2626" stroke="#fff" stroke-width="2"/><text x="345" y="162" text-anchor="middle" font-family="monospace" font-size="8" fill="#fff">TCI</text>
  <rect x="375" y="145" width="30" height="25" rx="3" fill="#f59e0b"/><text x="390" y="162" text-anchor="middle" font-family="monospace" font-size="8" fill="#fff">Type</text>
  <rect x="410" y="145" width="180" height="25" rx="3" fill="#22c55e"/><text x="500" y="162" text-anchor="middle" font-family="monospace" font-size="9" fill="#fff">Données (Payload)</text>
  <rect x="595" y="145" width="40" height="25" rx="3" fill="#ef4444"/><text x="615" y="162" text-anchor="middle" font-family="monospace" font-size="9" fill="#fff">FCS</text>
  <rect x="50" y="195" width="450" height="100" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="60" y="215" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#475569">TCI (Tag Control Information) — 16 bits</text>
  <rect x="60" y="225" width="30" height="18" rx="2" fill="#fca5a5"/><text x="75" y="238" text-anchor="middle" font-family="monospace" font-size="8" fill="#7f1d1d">PCP</text>
  <rect x="95" y="225" width="12" height="18" rx="2" fill="#fca5a5"/><text x="101" y="238" text-anchor="middle" font-family="monospace" font-size="8" fill="#7f1d1d">DEI</text>
  <rect x="112" y="225" width="120" height="18" rx="2" fill="#fca5a5"/><text x="172" y="238" text-anchor="middle" font-family="monospace" font-size="8" fill="#7f1d1d">VID (VLAN ID) — 12 bits</text>
  <text x="60" y="275" font-family="Arial,sans-serif" font-size="10" fill="#64748b">PCP: Priorité (CoS, 3 bits) | DEI: Drop Eligible | VID: Identifiant VLAN (1-4094)</text>
</svg>