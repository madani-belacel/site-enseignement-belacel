<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#f8fafc" rx="8"/>
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#e2e8f0" stroke-width="2" rx="4" stroke-dasharray="8,4"/>
  <text x="400" y="40" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#1e293b">TP 04 — Capture Wireshark</text>
  <text x="400" y="62" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8">Schéma pédagogique — Module Réseaux — Dr. BELACEL Madani</text>
  <rect x="50" y="90" width="700" height="40" rx="6" fill="#1e293b"/>
  <text x="400" y="115" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#fff" font-weight="bold">Analyse de trames Ethernet avec Wireshark</text>
  <rect x="50" y="150" width="700" height="60" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="60" y="172" font-family="monospace" font-size="10" fill="#1e293b" font-weight="bold">No.  Temps      Source               Destination           Protocole  Info</text>
  <text x="60" y="190" font-family="monospace" font-size="9" fill="#3b82f6">  1  0.000000   192.168.1.10         93.184.216.34         HTTP       GET /index.html</text>
  <rect x="50" y="230" width="700" height="120" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="1"/>
  <text x="60" y="252" font-family="monospace" font-size="10" fill="#ef4444" font-weight="bold">Frame 1: 74 bytes on wire (592 bits)</text>
  <text x="60" y="270" font-family="monospace" font-size="10" fill="#7c3aed" font-weight="bold">Ethernet II, Src: 00:1a:2b:3c:4d:5e, Dst: 00:5e:4d:3c:2b:1a</text>
  <text x="60" y="288" font-family="monospace" font-size="10" fill="#f59e0b" font-weight="bold">Internet Protocol Version 4, Src: 192.168.1.10, Dst: 93.184.216.34</text>
  <text x="60" y="306" font-family="monospace" font-size="10" fill="#22c55e" font-weight="bold">Transmission Control Protocol, Src Port: 54321, Dst Port: 80</text>
  <text x="60" y="324" font-family="monospace" font-size="10" fill="#3b82f6" font-weight="bold">Hypertext Transfer Protocol</text>
  <text x="60" y="380" font-family="Arial,sans-serif" font-size="11" fill="#64748b">TP pratique: capturer et analyser les trames Ethernet, identifier les champs MAC, Type, IP, Ports</text>
</svg>